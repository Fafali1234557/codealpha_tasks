name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [CodeAlpha_FlashcardQuizApp, CodeAlpha_RandomQuoteGenerator, CodeAlpha_FitnessTracker]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: flutter pub get
      - name: Analyze
        working-directory: ${{ matrix.project }}
        run: flutter analyze
      - name: Test
        working-directory: ${{ matrix.project }}
        run: flutter test
